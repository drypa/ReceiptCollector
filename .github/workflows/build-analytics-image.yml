name: Build Analytics Docker Image

on:
  push:
    paths:
      - 'Analytics/**'
      - '.github/workflows/build-analytics-image.yml'
  pull_request:
    paths:
      - 'Analytics/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Start Docker containers for tests
      run: |
        docker run -d --name postgres-test -p 5432:5432 -e POSTGRES_PASSWORD=test -e POSTGRES_DB=analytics_test postgres:16-alpine
        docker run -d --name mongo-test -p 27017:27017 mongo:7.0
        sleep 10

    - name: Run tests
      run: |
        cd Analytics
        dotnet test --configuration Release

    - name: Stop Docker containers
      if: always()
      run: |
        docker stop postgres-test || true
        docker stop mongo-test || true
        docker rm postgres-test || true
        docker rm mongo-test || true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      if: github.event_name != 'pull_request'
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_SECRET }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: drypa/receipt-collector-analytics
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./Analytics
        file: ./Analytics/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max