events {
    worker_connections 1024;
}

http {
    # Docker-internal DNS-резолвер. Разрешает имена сервисов
    # динамически (не только при старте nginx), что исключает
    # ошибку «host not found in upstream» при временной
    # недоступности контейнера analytics.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name localhost;  # заменить на реальный домен при необходимости

        ssl_certificate     /etc/nginx/ssl/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/certs/private.key;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Статика фронтенда (раздаётся nginx, не проксируется)
        root /usr/share/nginx/html;
        index index.html;

        # Закрытие эндпоинта генерации auth-ссылки от внешнего мира (см. ADR-016).
        # Точное совпадение — не задевает /api/users/auth?token=... и /is-admin.
        location = /api/users/auth/link {
            return 404;
        }

        # API -> Analytics
        # Используем переменную $target, чтобы nginx разрешал DNS
        # при каждом запросе, а не при старте. Это работает благодаря
        # директиве resolver выше.
        location /api {
            set $target analytics:5039;
            proxy_pass http://$target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Кэшируемые ассеты сборки
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA-fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
